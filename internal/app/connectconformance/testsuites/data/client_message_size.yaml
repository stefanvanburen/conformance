name: Client Message Size
# Tests that a client enforces its message receive limit on response messages.
# The reference server pads each expanded response so that the serialized
# message is exactly its size relative to the client's limit. A response that
# exceeds the limit should fail the RPC with a resource exhausted error after
# any earlier responses.
#
# There are no full-duplex cases where a response exceeds the limit: the
# reference client's gRPC implementation hangs on them until it includes
# connectrpc/connect-go#1005.
mode: TEST_MODE_CLIENT
reliesOnMessageReceiveLimit: true
# We only test client message size interactions over the proto codec because
# the reference server calculates response size based on the binary format.
relevantCodecs:
  - CODEC_PROTO
testCases:
# Unary Tests -----------------------------------------------------------------
- request:
    testName: unary/response-equal-to-client-limit
    streamType: STREAM_TYPE_UNARY
    requestMessages:
    - "@type": type.googleapis.com/connectrpc.conformance.v1.UnaryRequest
      responseDefinition:
        responseData: "dGVzdCByZXNwb25zZQ=="
  expandResponses:
    - sizeRelativeToLimit: 0
- request:
    testName: unary/response-exceeds-client-limit
    streamType: STREAM_TYPE_UNARY
    requestMessages:
    - "@type": type.googleapis.com/connectrpc.conformance.v1.UnaryRequest
      responseDefinition:
        responseData: "dGVzdCByZXNwb25zZQ=="
  expandResponses:
    - sizeRelativeToLimit: 1
# Client Stream Tests ---------------------------------------------------------
- request:
    testName: client-stream/response-equal-to-client-limit
    streamType: STREAM_TYPE_CLIENT_STREAM
    requestMessages:
    - "@type": type.googleapis.com/connectrpc.conformance.v1.ClientStreamRequest
      responseDefinition:
        responseData: "dGVzdCByZXNwb25zZQ=="
    - "@type": type.googleapis.com/connectrpc.conformance.v1.ClientStreamRequest
      requestData: "dGVzdCByZXNwb25zZQ=="
  expandResponses:
    - sizeRelativeToLimit: 0
- request:
    testName: client-stream/response-exceeds-client-limit
    streamType: STREAM_TYPE_CLIENT_STREAM
    requestMessages:
    - "@type": type.googleapis.com/connectrpc.conformance.v1.ClientStreamRequest
      responseDefinition:
        responseData: "dGVzdCByZXNwb25zZQ=="
    - "@type": type.googleapis.com/connectrpc.conformance.v1.ClientStreamRequest
      requestData: "dGVzdCByZXNwb25zZQ=="
  expandResponses:
    - sizeRelativeToLimit: 1
# Server Stream Tests ---------------------------------------------------------
- request:
    testName: server-stream/all-responses-equal-to-client-limit
    streamType: STREAM_TYPE_SERVER_STREAM
    requestMessages:
    - "@type": type.googleapis.com/connectrpc.conformance.v1.ServerStreamRequest
      responseDefinition:
        responseData:
          - "dGVzdCByZXNwb25zZQ=="
          - "dGVzdCByZXNwb25zZQ=="
  expandResponses:
    - sizeRelativeToLimit: 0
    - sizeRelativeToLimit: 0
- request:
    testName: server-stream/first-response-exceeds-client-limit
    streamType: STREAM_TYPE_SERVER_STREAM
    requestMessages:
    - "@type": type.googleapis.com/connectrpc.conformance.v1.ServerStreamRequest
      responseDefinition:
        responseData:
          - "dGVzdCByZXNwb25zZQ=="
          - "dGVzdCByZXNwb25zZQ=="
  expandResponses:
    - sizeRelativeToLimit: 1
    - sizeRelativeToLimit: 0
- request:
    testName: server-stream/subsequent-response-exceeds-client-limit
    streamType: STREAM_TYPE_SERVER_STREAM
    requestMessages:
    - "@type": type.googleapis.com/connectrpc.conformance.v1.ServerStreamRequest
      responseDefinition:
        responseData:
          - "dGVzdCByZXNwb25zZQ=="
          - "dGVzdCByZXNwb25zZQ=="
  expandResponses:
    - sizeRelativeToLimit: 0
    - sizeRelativeToLimit: 1
# Bidi Stream Tests -----------------------------------------------------------
- request:
    testName: bidi-stream/half-duplex/all-responses-equal-to-client-limit
    streamType: STREAM_TYPE_HALF_DUPLEX_BIDI_STREAM
    requestMessages:
    - "@type": type.googleapis.com/connectrpc.conformance.v1.BidiStreamRequest
      responseDefinition:
        responseData:
          - "dGVzdCByZXNwb25zZQ=="
          - "dGVzdCByZXNwb25zZQ=="
    - "@type": type.googleapis.com/connectrpc.conformance.v1.BidiStreamRequest
      requestData: "dGVzdCByZXNwb25zZQ=="
  expandResponses:
    - sizeRelativeToLimit: 0
    - sizeRelativeToLimit: 0
- request:
    testName: bidi-stream/half-duplex/first-response-exceeds-client-limit
    streamType: STREAM_TYPE_HALF_DUPLEX_BIDI_STREAM
    requestMessages:
    - "@type": type.googleapis.com/connectrpc.conformance.v1.BidiStreamRequest
      responseDefinition:
        responseData:
          - "dGVzdCByZXNwb25zZQ=="
          - "dGVzdCByZXNwb25zZQ=="
    - "@type": type.googleapis.com/connectrpc.conformance.v1.BidiStreamRequest
      requestData: "dGVzdCByZXNwb25zZQ=="
  expandResponses:
    - sizeRelativeToLimit: 1
    - sizeRelativeToLimit: 0
- request:
    testName: bidi-stream/half-duplex/subsequent-response-exceeds-client-limit
    streamType: STREAM_TYPE_HALF_DUPLEX_BIDI_STREAM
    requestMessages:
    - "@type": type.googleapis.com/connectrpc.conformance.v1.BidiStreamRequest
      responseDefinition:
        responseData:
          - "dGVzdCByZXNwb25zZQ=="
          - "dGVzdCByZXNwb25zZQ=="
    - "@type": type.googleapis.com/connectrpc.conformance.v1.BidiStreamRequest
      requestData: "dGVzdCByZXNwb25zZQ=="
  expandResponses:
    - sizeRelativeToLimit: 0
    - sizeRelativeToLimit: 1
- request:
    testName: bidi-stream/full-duplex/all-responses-equal-to-client-limit
    streamType: STREAM_TYPE_FULL_DUPLEX_BIDI_STREAM
    requestMessages:
    - "@type": type.googleapis.com/connectrpc.conformance.v1.BidiStreamRequest
      responseDefinition:
        responseData:
          - "dGVzdCByZXNwb25zZQ=="
          - "dGVzdCByZXNwb25zZQ=="
      fullDuplex: true
    - "@type": type.googleapis.com/connectrpc.conformance.v1.BidiStreamRequest
      requestData: "dGVzdCByZXNwb25zZQ=="
  expandResponses:
    - sizeRelativeToLimit: 0
    - sizeRelativeToLimit: 0
