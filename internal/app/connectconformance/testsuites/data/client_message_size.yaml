name: Client Message Size
# Tests that a client applies its message receive limit to response messages.
# Each test case sets a receive limit well below the server's limit, so that
# the test cases stay small. Responses echo the request in their request info,
# so a response under the limit still uses a small payload. The large payload
# is 5121 bytes of "x", which compresses well, so the limit must apply to the
# decompressed size.
mode: TEST_MODE_CLIENT
reliesOnMessageReceiveLimit: true
relevantCodecs:
  - CODEC_PROTO
testCases:
  - request:
      testName: unary/response-under-client-limit
      streamType: STREAM_TYPE_UNARY
      messageReceiveLimit: 4096
      requestMessages:
        - "@type": type.googleapis.com/connectrpc.conformance.v1.UnaryRequest
          responseDefinition:
            responseData: "dGVzdCByZXNwb25zZQ=="
  - request:
      testName: unary/response-exceeds-client-limit
      streamType: STREAM_TYPE_UNARY
      messageReceiveLimit: 4096
      requestMessages:
        - "@type": type.googleapis.com/connectrpc.conformance.v1.UnaryRequest
          responseDefinition:
            responseData: ""
    expectedResponse:
      error:
        code: CODE_RESOURCE_EXHAUSTED
  - request:
      testName: client-stream/response-under-client-limit
      streamType: STREAM_TYPE_CLIENT_STREAM
      messageReceiveLimit: 4096
      requestMessages:
        - "@type": type.googleapis.com/connectrpc.conformance.v1.ClientStreamRequest
          responseDefinition:
            responseData: "dGVzdCByZXNwb25zZQ=="
        - "@type": type.googleapis.com/connectrpc.conformance.v1.ClientStreamRequest
          requestData: "dGVzdCByZXNwb25zZQ=="
  - request:
      testName: client-stream/response-exceeds-client-limit
      streamType: STREAM_TYPE_CLIENT_STREAM
      messageReceiveLimit: 4096
      requestMessages:
        - "@type": type.googleapis.com/connectrpc.conformance.v1.ClientStreamRequest
          responseDefinition:
            responseData: ""
        - "@type": type.googleapis.com/connectrpc.conformance.v1.ClientStreamRequest
          requestData: "dGVzdCByZXNwb25zZQ=="
    expectedResponse:
      error:
        code: CODE_RESOURCE_EXHAUSTED
  - request:
      testName: server-stream/responses-under-client-limit
      streamType: STREAM_TYPE_SERVER_STREAM
      messageReceiveLimit: 4096
      requestMessages:
        - "@type": type.googleapis.com/connectrpc.conformance.v1.ServerStreamRequest
          responseDefinition:
            responseData:
              - "dGVzdCByZXNwb25zZQ=="
              - "dGVzdCByZXNwb25zZQ=="
  - request:
      testName: server-stream/first-response-exceeds-client-limit
      streamType: STREAM_TYPE_SERVER_STREAM
      messageReceiveLimit: 4096
      requestMessages:
        - "@type": type.googleapis.com/connectrpc.conformance.v1.ServerStreamRequest
          responseDefinition:
            responseData:
              - ""
              - "dGVzdCByZXNwb25zZQ=="
    expectedResponse:
      error:
        code: CODE_RESOURCE_EXHAUSTED
  - request:
      testName: bidi-stream/half-duplex/responses-under-client-limit
      streamType: STREAM_TYPE_HALF_DUPLEX_BIDI_STREAM
      messageReceiveLimit: 4096
      requestMessages:
        - "@type": type.googleapis.com/connectrpc.conformance.v1.BidiStreamRequest
          responseDefinition:
            responseData:
              - "dGVzdCByZXNwb25zZQ=="
              - "dGVzdCByZXNwb25zZQ=="
        - "@type": type.googleapis.com/connectrpc.conformance.v1.BidiStreamRequest
          requestData: "dGVzdCByZXNwb25zZQ=="
  - request:
      testName: bidi-stream/half-duplex/first-response-exceeds-client-limit
      streamType: STREAM_TYPE_HALF_DUPLEX_BIDI_STREAM
      messageReceiveLimit: 4096
      requestMessages:
        - "@type": type.googleapis.com/connectrpc.conformance.v1.BidiStreamRequest
          responseDefinition:
            responseData:
              - ""
              - "dGVzdCByZXNwb25zZQ=="
        - "@type": type.googleapis.com/connectrpc.conformance.v1.BidiStreamRequest
          requestData: "dGVzdCByZXNwb25zZQ=="
    expectedResponse:
      error:
        code: CODE_RESOURCE_EXHAUSTED
  - request:
      testName: bidi-stream/full-duplex/responses-under-client-limit
      streamType: STREAM_TYPE_FULL_DUPLEX_BIDI_STREAM
      messageReceiveLimit: 4096
      requestMessages:
        - "@type": type.googleapis.com/connectrpc.conformance.v1.BidiStreamRequest
          responseDefinition:
            responseData:
              - "dGVzdCByZXNwb25zZQ=="
              - "dGVzdCByZXNwb25zZQ=="
          fullDuplex: true
        - "@type": type.googleapis.com/connectrpc.conformance.v1.BidiStreamRequest
          requestData: "dGVzdCByZXNwb25zZQ=="
  - request:
      testName: bidi-stream/full-duplex/first-response-exceeds-client-limit
      streamType: STREAM_TYPE_FULL_DUPLEX_BIDI_STREAM
      messageReceiveLimit: 4096
      requestMessages:
        - "@type": type.googleapis.com/connectrpc.conformance.v1.BidiStreamRequest
          responseDefinition:
            responseData:
              - ""
              - "dGVzdCByZXNwb25zZQ=="
          fullDuplex: true
        - "@type": type.googleapis.com/connectrpc.conformance.v1.BidiStreamRequest
          requestData: "dGVzdCByZXNwb25zZQ=="
    # The server waits for the second request before it sends the second
    # response, so a client that keeps reading after rejecting the first
    # response waits forever.
    expectedResponse:
      error:
        code: CODE_RESOURCE_EXHAUSTED
      numUnsentRequests: 1
