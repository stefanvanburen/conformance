name: Connect Client Error Message Size
# Tests that a Connect client enforces its message receive limit on the body
# of a unary error. The reference server pads the error message relative to
# the client's limit. The error under the limit leaves room for the rest of
# the error body, whose details echo the request.
mode: TEST_MODE_CLIENT
reliesOnMessageReceiveLimit: true
relevantProtocols:
  - PROTOCOL_CONNECT
testCases:
  - request:
      testName: unary/error-under-client-limit
      streamType: STREAM_TYPE_UNARY
      requestMessages:
        - "@type": type.googleapis.com/connectrpc.conformance.v1.UnaryRequest
          responseDefinition:
            error:
              code: CODE_FAILED_PRECONDITION
              message: error under limit
    expandError:
      sizeRelativeToLimit: -16384
  - request:
      testName: unary/error-exceeds-client-limit
      streamType: STREAM_TYPE_UNARY
      requestMessages:
        - "@type": type.googleapis.com/connectrpc.conformance.v1.UnaryRequest
          responseDefinition:
            error:
              code: CODE_FAILED_PRECONDITION
              message: error exceeds limit
    expandError:
      sizeRelativeToLimit: 1
