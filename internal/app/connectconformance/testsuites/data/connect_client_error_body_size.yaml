name: Connect Client Error Body Size
# Tests that a Connect client applies its message receive limit to the body of
# a unary error. Each test case sets a receive limit well below the server's
# limit, so that the error body can exceed the client's limit without the
# request, which carries the error message, exceeding the server's limit.
# The limit leaves room for the error details, which echo the request and
# make an error body around 2 KiB even when its message is short.
mode: TEST_MODE_CLIENT
reliesOnMessageReceiveLimit: true
relevantProtocols:
  - PROTOCOL_CONNECT
testCases:
  - request:
      testName: unary/error-under-client-limit
      streamType: STREAM_TYPE_UNARY
      messageReceiveLimit: 4096
      requestMessages:
        - "@type": type.googleapis.com/connectrpc.conformance.v1.UnaryRequest
          responseDefinition:
            error:
              code: CODE_FAILED_PRECONDITION
              message: error under limit
  - request:
      testName: unary/error-exceeds-client-limit
      streamType: STREAM_TYPE_UNARY
      messageReceiveLimit: 4096
      requestMessages:
        - "@type": type.googleapis.com/connectrpc.conformance.v1.UnaryRequest
          responseDefinition:
            error:
              code: CODE_FAILED_PRECONDITION
              # 5120 bytes, more than the client's limit.
              message: 
    expectedResponse:
      error:
        code: CODE_RESOURCE_EXHAUSTED
